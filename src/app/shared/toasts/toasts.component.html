<div class="toasts">
  @for (toast of toasts(); track toast.id) {
    <div [class]="'toast toast--' + toast.type">
      <span class="toast__message">{{ toast.message }}</span>
      <button
        type="button"
        class="toast__close"
        (click)="onDismiss(toast.id)"
        aria-label="Закрыть уведомление"
      >
        ✕
      </button>
    </div>
  }
</div>
